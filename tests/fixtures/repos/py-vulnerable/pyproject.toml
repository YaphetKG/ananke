[project]
name = "py-vulnerable"
version = "0.1.0"
description = "Ananke test fixture: a tiny uv project pinning known-vulnerable requests and urllib3."
requires-python = ">=3.11"
dependencies = [
    "requests==2.25.1",
    "urllib3==1.26.5",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_vulnerable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
